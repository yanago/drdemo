pekko {
  loglevel = "INFO"
  loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
  logging-filter = "org.apache.pekko.event.slf4j.Slf4jLoggingFilter"

  actor {
    default-dispatcher {
      type = Dispatcher
      executor = "fork-join-executor"
      fork-join-executor {
        parallelism-min = 4
        parallelism-factor = 2.0
        parallelism-max = 32
      }
    }

    # Dedicated dispatcher for blocking Iceberg I/O
    iceberg-dispatcher {
      type = Dispatcher
      executor = "thread-pool-executor"
      thread-pool-executor {
        fixed-pool-size = 8
      }
      throughput = 1
    }

    # Dedicated dispatcher for Kafka writes
    kafka-dispatcher {
      type = Dispatcher
      executor = "thread-pool-executor"
      thread-pool-executor {
        fixed-pool-size = 4
      }
      throughput = 10
    }
  }

  http {
    server {
      idle-timeout = 60s
      request-timeout = 30s
    }
  }
}

dr-replay {
  http {
    host = "0.0.0.0"
    host = ${?HTTP_HOST}
    port = 8080
    port = ${?HTTP_PORT}
  }

  iceberg {
    warehouse = "/tmp/iceberg-warehouse"
    warehouse = ${?ICEBERG_WAREHOUSE}
    table-name = "security_events"
    catalog-name = "dr_catalog"
    # For S3/MinIO backed storage
    s3-endpoint = ${?S3_ENDPOINT}
    s3-access-key = ${?S3_ACCESS_KEY}
    s3-secret-key = ${?S3_SECRET_KEY}
    s3-bucket = "iceberg-warehouse"
    s3-bucket = ${?S3_BUCKET}
  }

  kafka {
    bootstrap-servers = "localhost:9092"
    bootstrap-servers = ${?KAFKA_BOOTSTRAP_SERVERS}
    topic = "security-events-replay"
    topic = ${?KAFKA_TOPIC}
    acks = "all"
    retries = 3
    batch-size = 16384
    linger-ms = 5
    compression-type = "snappy"
  }

  replay {
    default-batch-size = 500
    default-rate-per-second = 1000
    max-concurrent-jobs = 10
    checkpoint-interval = 1000  # checkpoint every N events
  }
}
